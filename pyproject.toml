[project]
name = "naoqi-bridge"
version = "0.1.0"
description = "High-level async API, MCP server and WebSocket server bridging AI agents to Naoqi robots (Nao), with a fake-robot mode for hardware-free use."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # capped by the libqi wheels (cp312, cp313)
dependencies = [
    "mcp>=1.9,<2",
    "websockets>=17.2",
    # Only where a libqi wheel exists; elsewhere the bridge runs the fake backend only.
    "qi>=3.1.8,<4; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[project.optional-dependencies]
# The sim backend (specs/sim.md): naoqi-sim, with its window and render camera. It needs
# qi, so it exists where qi does.
sim = ["naoqi-sim[viewer]; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')"]
# The live-tier harness (specs/testing_support.md): naoqi_bridge.testing, a pytest plugin.
test = ["pytest>=9.1.1"]
# The viewer (specs/viewer.md): a naoqi-viewer window mirroring the robot. It needs qi too.
viewer = ["naoqi-viewer; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')"]

[project.scripts]
naoqi-mcp-server = "naoqi_bridge.naoqi_mcp_server:main"
naoqi-websocket-server = "naoqi_bridge.naoqi_websocket_server:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

# libqi Python 3 wheels come from the funwithagents fork's package index on GitHub Pages, not PyPI
# (PyPI's `qi` is Aldebaran's older 3.1.5). The fork builds them for macOS arm64, Linux x86_64 and
# Windows x64 only; the other environments lock without `qi` and run the fake backend only.
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "libqi"
url = "https://funwithagents.github.io/libqi-python/simple/"
explicit = true  # only the packages pinned to it below come from it

[tool.uv.sources]
qi = { index = "libqi" }
# naoqi-sim is not on PyPI: its repository, pinned to a commit moved on purpose (specs/project.md).
naoqi-sim = { git = "https://github.com/funwithagents/naoqi-sim", rev = "e0750eab5820f5256bf95ca41b4725578fe0319e" }
# naoqi-viewer is not on PyPI either. naoqi-sim[viewer] installs it too, and an environment
# holds one: this is the commit naoqi-sim pins, and the two move together (specs/project.md).
naoqi-viewer = { git = "https://github.com/funwithagents/naoqi-viewer", rev = "9964bc00df11194757251fe22c256cce3f740fe4" }

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python
# specs/ and plans/ hold design sketches in code fences, not code to format.
extend-exclude = ["specs", "plans"]

[tool.ruff.lint]
# Ruff's defaults are already broad; add pycodestyle, perf and annotations.
extend-select = ["E", "W", "PERF", "ANN"]
ignore = [
    "E501",  # line length is the formatter's job
    "ANN401",  # Any is the honest type for untyped JSON input and qi service objects
]

[tool.ruff.lint.per-file-ignores]
# Test functions don't need return types.
"tests/**" = ["ANN"]
"tests-e2e/**" = ["ANN"]

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]
markers = [
    "fake_behavior_durations: keep the fake's real behavior, speech and posture durations (5 s, 1 s, 2 s) instead of the fast tier's 0",
]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "naoqi-bridge[sim,test,viewer]",  # the sim and viewer code type-check against their real APIs; the live tier runs a sim on the shipped harness
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
