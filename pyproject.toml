[project]
name = "nao_bridge"
version = "0.1.0"
description = "High-level async API, MCP server and WebSocket server bridging AI agents to Naoqi robots (Nao), with a fake-robot mode for hardware-free use."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # capped by the libqi wheels (cp312, cp313)
dependencies = [
    "mcp>=1.9,<2",
    "websockets>=17.2",
    # Only where a libqi wheel exists; elsewhere the bridge runs the fake backend only.
    "qi==3.1.6; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[project.scripts]
nao-mcp-server = "nao_bridge.nao_mcp_server:main"
nao-websocket-server = "nao_bridge.nao_websocket_server:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

# libqi Python 3 wheels come from the GitHub Releases of the funwithagents fork, not PyPI
# (PyPI's `qi` is Aldebaran's older 3.1.5). Only macOS arm64 and Linux x86_64 wheels exist;
# the other environments lock without `qi` and run the fake backend only.
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
qi = [
    { url = "https://github.com/funwithagents/libqi-python/releases/download/v3.1.6/qi-3.1.6-cp312-cp312-macosx_15_0_arm64.whl", marker = "sys_platform == 'darwin' and python_version == '3.12'" },
    { url = "https://github.com/funwithagents/libqi-python/releases/download/v3.1.6/qi-3.1.6-cp313-cp313-macosx_15_0_arm64.whl", marker = "sys_platform == 'darwin' and python_version == '3.13'" },
    { url = "https://github.com/funwithagents/libqi-python/releases/download/v3.1.6/qi-3.1.6-cp312-cp312-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12'" },
    { url = "https://github.com/funwithagents/libqi-python/releases/download/v3.1.6/qi-3.1.6-cp313-cp313-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.13'" },
]

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python
# specs/ and plans/ hold design sketches in code fences, not code to format.
extend-exclude = ["specs", "plans"]

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
